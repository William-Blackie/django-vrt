[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "django-vrt"
version = "0.2.0"
description = "Deterministic visual regression testing CLI for Django platforms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "William Blackie" }
]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "django>=4.2",
  "httpx>=0.27.2",
  "lxml>=5.3.0",
  "pillow>=10.4.0",
  "playwright>=1.49.1",
  "pydantic>=2.9.2",
  "rich>=13.9.4",
  "tomli-w>=1.1.0",
  "typer>=0.15.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.1",
  "mypy>=1.13.0"
]

[project.scripts]
djvrt = "djvrt.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
mypy_path = "src"

[tool.hatch.build.targets.wheel]
packages = ["src/djvrt"]
