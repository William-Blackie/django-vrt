name: visual-regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  djvrt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Install Chromium
        run: uv run playwright install chromium

      # Add your own service startup for Django + db here.
      # Example:
      # - run: docker compose up -d db redis
      # - run: uv run python manage.py migrate
      # - run: uv run python manage.py runserver 0.0.0.0:8000 &

      - name: Discover routes
        run: uv run djvrt discover --settings your_project.settings

      - name: Build lockfile
        run: uv run djvrt lock

      - name: Check visual regressions
        run: uv run djvrt check

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djvrt-artifacts
          path: .djvrt/runs/
